<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Tebak-Tebakan Hiragana</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2430;
    --bg-card: #232E3D;
    --gold: #E8B04B;
    --cream: #F2EDE4;
    --muted: #8A96A3;
    --correct: #4C9A8E;
    --wrong: #C1554D;
    --border: #34404F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 440px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .top .label {
    font-size: 13px;
    color: var(--muted);
  }
  .top .score {
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }
  .track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .track-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.35s ease;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    transition: opacity 0.22s ease, transform 0.22s ease;
    opacity: 1;
    transform: translateY(0);
  }
  .card.fade-out {
    opacity: 0;
    transform: translateY(10px);
  }
  .prompt {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .kana-display {
    font-family: 'Fraunces', serif;
    font-size: 72px;
    font-weight: 500;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 0;
    margin-bottom: 22px;
    color: var(--gold);
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt {
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 14px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--gold);
  }
  .opt:disabled { cursor: default; }
  .opt.correct {
    border-color: var(--correct);
    background: rgba(76, 154, 142, 0.15);
  }
  .opt.wrong {
    border-color: var(--wrong);
    background: rgba(193, 85, 77, 0.15);
  }
  .next {
    margin-top: 20px;
    width: 100%;
    background: var(--gold);
    color: #1B2430;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .next.show { opacity: 1; pointer-events: auto; }
  .result {
    text-align: center;
  }
  .result .big {
    font-family: 'Fraunces', serif;
    font-size: 48px;
    font-weight: 700;
    color: var(--gold);
    margin: 6px 0 4px;
  }
  .result p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .retry, .backbtn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 13px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .backbtn { margin-top: 10px; border-color: var(--border); color: var(--muted); }
  .levels {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .level-card {
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 16px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s ease;
  }
  .level-card:hover { border-color: var(--gold); }
  .level-card .lname {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .level-card .ldesc {
    font-size: 13px;
    color: var(--muted);
  }
  .logo {
    position: fixed;
    top: 18px;
    left: 18px;
    height: 32px;
    width: auto;
    z-index: 10;
  }
  .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 22px;
  }
</style>
</head>
<body>
<svg class="logo" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#E8B04B" stroke-width="4" stroke-linecap="round">
    <line x1="14" y1="6" x2="18" y2="18"/>
    <line x1="2" y1="20" x2="14" y2="26"/>
  </g>
  <text x="8" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-style="italic" font-size="38" letter-spacing="-1" fill="#E8B04B" transform="skewX(-8)">Ftggg</text>
</svg>
<div class="wrap">
  <div class="top" id="topBar" style="display:none;">
    <span class="label" id="progressLabel">Soal 1</span>
    <span class="score" id="scoreLabel">Skor: 0</span>
  </div>
  <div class="track" id="trackWrap" style="display:none;"><div class="track-fill" id="trackFill" style="width:0%"></div></div>
  <div class="card" id="card"></div>
</div>

<script>
const KANA = [
  // Gampang : hiragana dasar, 1 huruf
  { kana: "あ", romaji: "a", level: 1 }, { kana: "い", romaji: "i", level: 1 },
  { kana: "う", romaji: "u", level: 1 }, { kana: "え", romaji: "e", level: 1 },
  { kana: "お", romaji: "o", level: 1 },
  { kana: "か", romaji: "ka", level: 1 }, { kana: "き", romaji: "ki", level: 1 },
  { kana: "く", romaji: "ku", level: 1 }, { kana: "け", romaji: "ke", level: 1 },
  { kana: "こ", romaji: "ko", level: 1 },
  { kana: "さ", romaji: "sa", level: 1 }, { kana: "し", romaji: "shi", level: 1 },
  { kana: "す", romaji: "su", level: 1 }, { kana: "せ", romaji: "se", level: 1 },
  { kana: "そ", romaji: "so", level: 1 },
  { kana: "た", romaji: "ta", level: 1 }, { kana: "ち", romaji: "chi", level: 1 },
  { kana: "つ", romaji: "tsu", level: 1 }, { kana: "て", romaji: "te", level: 1 },
  { kana: "と", romaji: "to", level: 1 },
  { kana: "な", romaji: "na", level: 1 }, { kana: "に", romaji: "ni", level: 1 },
  { kana: "ぬ", romaji: "nu", level: 1 }, { kana: "ね", romaji: "ne", level: 1 },
  { kana: "の", romaji: "no", level: 1 },
  { kana: "は", romaji: "ha", level: 1 }, { kana: "ひ", romaji: "hi", level: 1 },
  { kana: "ふ", romaji: "fu", level: 1 }, { kana: "へ", romaji: "he", level: 1 },
  { kana: "ほ", romaji: "ho", level: 1 },
  { kana: "ま", romaji: "ma", level: 1 }, { kana: "み", romaji: "mi", level: 1 },
  { kana: "む", romaji: "mu", level: 1 }, { kana: "め", romaji: "me", level: 1 },
  { kana: "も", romaji: "mo", level: 1 },
  { kana: "や", romaji: "ya", level: 1 }, { kana: "ゆ", romaji: "yu", level: 1 },
  { kana: "よ", romaji: "yo", level: 1 },
  { kana: "ら", romaji: "ra", level: 1 }, { kana: "り", romaji: "ri", level: 1 },
  { kana: "る", romaji: "ru", level: 1 }, { kana: "れ", romaji: "re", level: 1 },
  { kana: "ろ", romaji: "ro", level: 1 },
  { kana: "わ", romaji: "wa", level: 1 }, { kana: "を", romaji: "wo", level: 1 },
  { kana: "ん", romaji: "n", level: 1 },

  // Mayan lah: dakuon & handakuon
  { kana: "が", romaji: "ga", level: 2 }, { kana: "ぎ", romaji: "gi", level: 2 },
  { kana: "ぐ", romaji: "gu", level: 2 }, { kana: "げ", romaji: "ge", level: 2 },
  { kana: "ご", romaji: "go", level: 2 },
  { kana: "ざ", romaji: "za", level: 2 }, { kana: "じ", romaji: "ji", level: 2 },
  { kana: "ず", romaji: "zu", level: 2 }, { kana: "ぜ", romaji: "ze", level: 2 },
  { kana: "ぞ", romaji: "zo", level: 2 },
  { kana: "だ", romaji: "da", level: 2 }, { kana: "ぢ", romaji: "ji", level: 2 },
  { kana: "づ", romaji: "zu", level: 2 }, { kana: "で", romaji: "de", level: 2 },
  { kana: "ど", romaji: "do", level: 2 },
  { kana: "ば", romaji: "ba", level: 2 }, { kana: "び", romaji: "bi", level: 2 },
  { kana: "ぶ", romaji: "bu", level: 2 }, { kana: "べ", romaji: "be", level: 2 },
  { kana: "ぼ", romaji: "bo", level: 2 },
  { kana: "ぱ", romaji: "pa", level: 2 }, { kana: "ぴ", romaji: "pi", level: 2 },
  { kana: "ぷ", romaji: "pu", level: 2 }, { kana: "ぺ", romaji: "pe", level: 2 },
  { kana: "ぽ", romaji: "po", level: 2 },

  // lulus: yoon (kana gabungan)
  { kana: "きゃ", romaji: "kya", level: 3 }, { kana: "きゅ", romaji: "kyu", level: 3 }, { kana: "きょ", romaji: "kyo", level: 3 },
  { kana: "しゃ", romaji: "sha", level: 3 }, { kana: "しゅ", romaji: "shu", level: 3 }, { kana: "しょ", romaji: "sho", level: 3 },
  { kana: "ちゃ", romaji: "cha", level: 3 }, { kana: "ちゅ", romaji: "chu", level: 3 }, { kana: "ちょ", romaji: "cho", level: 3 },
  { kana: "にゃ", romaji: "nya", level: 3 }, { kana: "にゅ", romaji: "nyu", level: 3 }, { kana: "にょ", romaji: "nyo", level: 3 },
  { kana: "ひゃ", romaji: "hya", level: 3 }, { kana: "ひゅ", romaji: "hyu", level: 3 }, { kana: "ひょ", romaji: "hyo", level: 3 },
  { kana: "みゃ", romaji: "mya", level: 3 }, { kana: "みゅ", romaji: "myu", level: 3 }, { kana: "みょ", romaji: "myo", level: 3 },
  { kana: "りゃ", romaji: "rya", level: 3 }, { kana: "りゅ", romaji: "ryu", level: 3 }, { kana: "りょ", romaji: "ryo", level: 3 },
  { kana: "じゃ", romaji: "ja", level: 3 }, { kana: "じゅ", romaji: "ju", level: 3 }, { kana: "じょ", romaji: "jo", level: 3 },
  { kana: "ぎゃ", romaji: "gya", level: 3 }, { kana: "ぎゅ", romaji: "gyu", level: 3 }, { kana: "ぎょ", romaji: "gyo", level: 3 },
  { kana: "びゃ", romaji: "bya", level: 3 }, { kana: "びゅ", romaji: "byu", level: 3 }, { kana: "びょ", romaji: "byo", level: 3 },
  { kana: "ぴゃ", romaji: "pya", level: 3 }, { kana: "ぴゅ", romaji: "pyu", level: 3 }, { kana: "ぴょ", romaji: "pyo", level: 3 }
];

const LEVELS = {
  1: { name: "Level 1: Hiragana Dasar", desc: "46 huruf tunggal — a, i, u, ka, sa, ta, na ..." },
  2: { name: "Level 2: Dakuon & Handakuon", desc: "Huruf dengan tanda petik dan bulatan — ga, za, da, ba, pa ..." },
  3: { name: "Level 3: Yōon", desc: "Kana gabungan — kya, sha, cha, nya ..." }
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQuiz(level, n) {
  const pool = KANA.filter(k => k.level === level);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  return chosen.map(item => {
    const distractors = shuffle(pool.filter(k => k.romaji !== item.romaji))
      .slice(0, 3)
      .map(k => k.romaji);
    const opts = shuffle([item.romaji, ...distractors]);
    return { kana: item.kana, options: opts, answer: opts.indexOf(item.romaji) };
  });
}

let quizSet = [];
let currentLevel = 1;
let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById('card');
const progressLabel = document.getElementById('progressLabel');
const scoreLabel = document.getElementById('scoreLabel');
const trackFill = document.getElementById('trackFill');
const topBar = document.getElementById('topBar');
const trackWrap = document.getElementById('trackWrap');

function transitionTo(renderFn) {
  card.classList.add('fade-out');
  setTimeout(() => {
    renderFn();
    // paksa reflow supaya transisi fade-in kepicu ulang
    void card.offsetWidth;
    card.classList.remove('fade-out');
  }, 200);
}

function renderLevelSelect() {
  topBar.style.display = 'none';
  trackWrap.style.display = 'none';
  card.innerHTML = `
    <p class="title">Kuis Hiragana</p>
    <p class="subtitle">Pilih level buat mulai latihan.</p>
    <div class="levels">
      ${[1,2,3].map(l => `
        <button class="level-card" data-l="${l}">
          <div class="lname">${LEVELS[l].name}</div>
          <div class="ldesc">${LEVELS[l].desc}</div>
        </button>
      `).join('')}
    </div>
  `;
  document.querySelectorAll('.level-card').forEach(btn => {
    btn.addEventListener('click', () => startLevel(parseInt(btn.dataset.l)));
  });
}

function startLevel(level) {
  currentLevel = level;
  quizSet = pickQuiz(level, 20);
  current = 0;
  score = 0;
  topBar.style.display = 'flex';
  trackWrap.style.display = 'block';
  transitionTo(renderQuestion);
}

function renderQuestion() {
  answered = false;
  const item = quizSet[current];
  progressLabel.textContent = `Soal ${current + 1} / ${quizSet.length}`;
  scoreLabel.textContent = `Skor: ${score}`;
  trackFill.style.width = `${(current / quizSet.length) * 100}%`;

  card.innerHTML = `
    <p class="prompt">Bacaan huruf hiragana ini adalah?</p>
    <div class="kana-display">${item.kana}</div>
    <div class="options" id="options">
      ${item.options.map((opt, i) => `<button class="opt" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <button class="next" id="nextBtn">${current === quizSet.length - 1 ? 'Lihat Hasil' : 'Lanjut'}</button>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}

function selectAnswer(i) {
  if (answered) return;
  answered = true;
  const item = quizSet[current];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  if (i === item.answer) {
    score++;
    btns[i].classList.add('correct');
  } else {
    btns[i].classList.add('wrong');
    btns[item.answer].classList.add('correct');
  }
  scoreLabel.textContent = `Skor: ${score}`;
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion() {
  current++;
  if (current >= quizSet.length) {
    transitionTo(renderResult);
  } else {
    transitionTo(renderQuestion);
  }
}

function renderResult() {
  trackFill.style.width = '100%';
  progressLabel.textContent = 'Selesai';
  const pct = Math.round((score / quizSet.length) * 100);
  let msg = 'Belajar lagi nyet!';
  if (pct >= 90) msg = 'Bangga Bet Tuh Gua Liat-Liat!';
  else if (pct >= 70) msg = 'Mayan Dah!';
  else if (pct >= 50) msg = 'TOLOL, coba lagi!';

  card.innerHTML = `
    <div class="result">
      <div class="big">${score}/${quizSet.length}</div>
      <p>${LEVELS[currentLevel].name} — ${msg}</p>
      <button class="retry" id="retryBtn">Main Lagi</button>
      <button class="backbtn" id="backBtn">Pilih Level Lain</button>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => {
    startLevel(currentLevel);
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    transitionTo(renderLevelSelect);
  });
}

renderLevelSelect();
</script>
</body>
</html>
