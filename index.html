<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Tebak-Tebakan Hiragana</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2430;
    --bg-card: #232E3D;
    --gold: #E8B04B;
    --cream: #F2EDE4;
    --muted: #8A96A3;
    --correct: #4C9A8E;
    --wrong: #C1554D;
    --border: #34404F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 440px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .top .label {
    font-size: 13px;
    color: var(--muted);
  }
  .top .score {
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }
  .track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .track-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.35s ease;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
  }
  .prompt {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .kana-display {
    font-family: 'Fraunces', serif;
    font-size: 72px;
    font-weight: 500;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 0;
    margin-bottom: 22px;
    color: var(--gold);
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt {
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 14px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--gold);
  }
  .opt:disabled { cursor: default; }
  .opt.correct {
    border-color: var(--correct);
    background: rgba(76, 154, 142, 0.15);
  }
  .opt.wrong {
    border-color: var(--wrong);
    background: rgba(193, 85, 77, 0.15);
  }
  .next {
    margin-top: 20px;
    width: 100%;
    background: var(--gold);
    color: #1B2430;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .next.show { opacity: 1; pointer-events: auto; }
  .result {
    text-align: center;
  }
  .result .big {
    font-family: 'Fraunces', serif;
    font-size: 48px;
    font-weight: 700;
    color: var(--gold);
    margin: 6px 0 4px;
  }
  .result p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .retry, .backbtn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 13px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .backbtn { margin-top: 10px; border-color: var(--border); color: var(--muted); }
  .levels {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .level-card {
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 16px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s ease;
  }
  .level-card:hover { border-color: var(--gold); }
  .level-card .lname {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .level-card .ldesc {
    font-size: 13px;
    color: var(--muted);
  }
  .logo {
    position: fixed;
    top: 18px;
    left: 18px;
    height: 32px;
    width: auto;
    z-index: 10;
  }
  .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 22px;
  }
</style>
</head>

  { kana: "ぶ", romaji: "bu", level: 2 }, { kana: "べ", romaji: "be", level: 2 },
  { kana: "ぼ", romaji: "bo", level: 2 },
  { kana: "ぱ", romaji: "pa", level: 2 }, { kana: "ぴ", romaji: "pi", level: 2 },
  { kana: "ぷ", romaji: "pu", level: 2 }, { kana: "ぺ", romaji: "pe", level: 2 },
  { kana: "ぽ", romaji: "po", level: 2 },

  // Level 3: yoon (kana gabungan)
  { kana: "きゃ", romaji: "kya", level: 3 }, { kana: "きゅ", romaji: "kyu", level: 3 }, { kana: "きょ", romaji: "kyo", level: 3 },
  { kana: "しゃ", romaji: "sha", level: 3 }, { kana: "しゅ", romaji: "shu", level: 3 }, { kana: "しょ", romaji: "sho", level: 3 },
  { kana: "ちゃ", romaji: "cha", level: 3 }, { kana: "ちゅ", romaji: "chu", level: 3 }, { kana: "ちょ", romaji: "cho", level: 3 },
  { kana: "にゃ", romaji: "nya", level: 3 }, { kana: "にゅ", romaji: "nyu", level: 3 }, { kana: "にょ", romaji: "nyo", level: 3 },
  { kana: "ひゃ", romaji: "hya", level: 3 }, { kana: "ひゅ", romaji: "hyu", level: 3 }, { kana: "ひょ", romaji: "hyo", level: 3 },

  { kana: "じゃ", romaji: "ja", level: 3 }, { kana: "じゅ", romaji: "ju", level: 3 }, { kana: "じょ", romaji: "jo", level: 3 },
  { kana: "ぎゃ", romaji: "gya", level: 3 }, { kana: "ぎゅ", romaji: "gyu", level: 3 }, { kana: "ぎょ", romaji: "gyo", level: 3 },
  { kana: "びゃ", romaji: "bya", level: 3 }, { kana: "びゅ", romaji: "byu", level: 3 }, { kana: "びょ", romaji: "byo", level: 3 },
  { kana: "ぴゃ", romaji: "pya", level: 3 }, { kana: "ぴゅ", romaji: "pyu", level: 3 }, { kana: "ぴょ", romaji: "pyo", level: 3 }

const LEVELS = {
  1: { name: "Level 1: Hiragana Dasar", desc: "46 huruf tunggal — a, i, u, ka, sa, ta, na ..." },
  2: { name: "Level 2: Dakuon & Handakuon", desc: "Huruf dengan tanda petik dan bulatan — ga, za, da, ba, pa ..." },
  3: { name: "Level 3: Yōon", desc: "Kana gabungan — kya, sha, cha, nya ..." }
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQuiz(level, n) {
  const pool = KANA.filter(k => k.level === level);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  return chosen.map(item => {
    const distractors = shuffle(pool.filter(k => k.romaji !== item.romaji))
      .slice(0, 3)
      .map(k => k.romaji);
    const opts = shuffle([item.romaji, ...distractors]);
    return { kana: item.kana, options: opts, answer: opts.indexOf(item.romaji) };
  });
}

let quizSet = [];
let currentLevel = 1;
let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById('card');
const progressLabel = document.getElementById('progressLabel');
const scoreLabel = document.getElementById('scoreLabel');
const trackFill = document.getElementById('trackFill');
const topBar = document.getElementById('topBar');
const trackWrap = document.getElementById('trackWrap');

function renderLevelSelect() {
  topBar.style.display = 'none';
  trackWrap.style.display = 'none';
  card.innerHTML = `
    <p class="title">Kuis Hiragana</p>
    <p class="subtitle">Pilih level buat mulai latihan.</p>
    <div class="levels">
      ${[1,2,3].map(l => `
        <button class="level-card" data-l="${l}">
          <div class="lname">${LEVELS[l].name}</div>
          <div class="ldesc">${LEVELS[l].desc}</div>
        </button>
      `).join('')}
    </div>
  `;
  document.querySelectorAll('.level-card').forEach(btn => {
    btn.addEventListener('click', () => startLevel(parseInt(btn.dataset.l)));
  });
}

function startLevel(level) {
  currentLevel = level;
  quizSet = pickQuiz(level, 20);
  current = 0;
  score = 0;
  topBar.style.display = 'flex';
  trackWrap.style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = quizSet[current];
  progressLabel.textContent = `Soal ${current + 1} / ${quizSet.length}`;
  scoreLabel.textContent = `Skor: ${score}`;
  trackFill.style.width = `${(current / quizSet.length) * 100}%`;

  card.innerHTML = `
    <p class="prompt">Bacaan huruf hiragana ini adalah?</p>
    <div class="kana-display">${item.kana}</div>
    <div class="options" id="options">
      ${item.options.map((opt, i) => `<button class="opt" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <button class="next" id="nextBtn">${current === quizSet.length - 1 ? 'Lihat Hasil' : 'Lanjut'}</button>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}

function selectAnswer(i) {
  if (answered) return;
  answered = true;
  const item = quizSet[current];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  if (i === item.answer) {
    score++;
    btns[i].classList.add('correct');
  } else {
    btns[i].classList.add('wrong');
    btns[item.answer].classList.add('correct');
  }
  scoreLabel.textContent = `Skor: ${score}`;
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion() {
  current++;
  if (current >= quizSet.length) {
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderResult() {
  trackFill.style.width = '100%';
  progressLabel.textContent = 'Selesai';
  const pct = Math.round((score / quizSet.length) * 100);
  let msg = 'Terus berlatih!';
  if (pct >= 90) msg = 'Luar biasa, hampir hafal semua!';
  else if (pct >= 70) msg = 'Bagus sekali!';
  else if (pct >= 50) msg = 'Lumayan, coba lagi!';

  card.innerHTML = `
    <div class="result">
      <div class="big">${score}/${quizSet.length}</div>
      <p>${LEVELS[currentLevel].name} — ${msg}</p>
      <button class="retry" id="retryBtn">Main Lagi</button>
      <button class="backbtn" id="backBtn">Pilih Level Lain</button>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => {
    startLevel(currentLevel);
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    renderLevelSelect();
  });
}

renderLevelSelect();
</script>
